<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f4f6f8">
<title>Catch Up</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%23222'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#f5325b;
    --pink-d:#e01f4a;
    --ink:#1c1f26;
    --mint:#00d68f;
  }
  body[data-theme="bright"]{--bg:#f4f6f8; --hud:#1c1f26; --dim:rgba(28,31,38,.5); --sheet:#ffffff; --sheet2:#eef1f5; --line:rgba(28,31,38,.08); --overlay:#1c1f26; --overlay-dim:rgba(28,31,38,.55)}
  body[data-theme="dark"]{--bg:#0a0c12; --hud:#f2f4f8; --dim:rgba(242,244,248,.55); --sheet:#141824; --sheet2:#0d1119; --line:rgba(255,255,255,.1); --overlay:#f2f4f8; --overlay-dim:rgba(242,244,248,.6)}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
  #game{position:fixed;inset:0}
  #game canvas{display:block;width:100%;height:100%}
  svg{display:block}

  /* ---- in-game minimal HUD: bare score number + gem count ---- */
  #hud{position:fixed;inset:0;z-index:10;pointer-events:none;color:var(--hud)}
  #scoreBig{position:absolute;top:calc(18px + env(safe-area-inset-top));left:50%;
    transform:translateX(-50%);font-size:34px;font-weight:800;line-height:1;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  #bestTag{position:absolute;top:calc(12px + env(safe-area-inset-top));left:50%;
    transform:translateX(-50%);font-size:11px;font-weight:800;opacity:0}
  #gemHud{position:absolute;top:calc(16px + env(safe-area-inset-top));right:14px;
    display:flex;align-items:center;gap:4px;font-size:17px;font-weight:800}
  #gemHud svg{width:19px;height:19px}
  #pauseBtn{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;
    pointer-events:auto;background:transparent;border:none;color:var(--hud);cursor:pointer;
    width:34px;height:34px;display:grid;place-items:center;opacity:.65}
  #pauseBtn svg{width:20px;height:20px}

  #flash{position:fixed;inset:0;pointer-events:none;z-index:18;opacity:0;background:rgba(245,50,91,.4)}
  #flash.on{animation:fl .5s ease-out}
  @keyframes fl{0%{opacity:1}100%{opacity:0}}

  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
    background:rgba(20,22,30,.9);color:#fff;padding:9px 18px;
    border-radius:999px;font-size:13.5px;font-weight:600;z-index:30;display:none;
    box-shadow:0 8px 24px rgba(0,0,0,.28)}

  /* ---- HOME: no card, floating over the live scene ---- */
  #home{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;pointer-events:none}
  #home.hidden{display:none}
  #homeTitle{margin-top:20vh;font-size:clamp(44px,13vw,72px);font-weight:800;
    color:var(--overlay);letter-spacing:-.03em;line-height:.9;text-align:center}
  #homeTitle .up{display:block}
  #homeBest{margin-top:10px;font-size:15px;font-weight:700;color:var(--overlay-dim);letter-spacing:.02em}
  #homeBtns{position:absolute;bottom:calc(34px + env(safe-area-inset-bottom));left:0;right:0;
    display:flex;align-items:center;justify-content:center;gap:14px;pointer-events:auto}
  .rbtn{border:none;border-radius:50%;background:var(--pink);color:#fff;cursor:pointer;
    display:grid;place-items:center;box-shadow:0 10px 22px rgba(245,50,91,.35);
    transition:transform .1s ease}
  .rbtn:active{transform:scale(.9)}
  .rbtn svg{width:22px;height:22px}
  .rbtn.sm{width:52px;height:52px}
  .rbtn.play{width:74px;height:74px;box-shadow:0 14px 30px rgba(245,50,91,.45)}
  .rbtn.play svg{width:30px;height:30px}

  /* ---- SHOP (full overlay, Ketchapp-grade) ---- */
  #shopWrap{position:fixed;inset:0;z-index:22;display:none}
  #shopWrap.open{display:block}
  #shopScrim{position:absolute;inset:0;background:rgba(8,10,16,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #shopSheet{position:absolute;inset:0;display:flex;flex-direction:column;
    background:var(--sheet);animation:sheetin .28s cubic-bezier(.2,1.1,.3,1)}
  @keyframes sheetin{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

  .shop-top{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;
    border-bottom:1px solid var(--line);flex:0 0 auto}
  .shop-top .back{width:38px;height:38px;border:none;border-radius:12px;background:var(--sheet2);
    color:var(--ink);display:grid;place-items:center;cursor:pointer}
  .shop-top .back:active{transform:scale(.92)}
  .shop-top .back svg{width:20px;height:20px}
  .shop-top h2{font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-.02em;flex:1}
  .shop-top .bank{display:flex;align-items:center;gap:6px;background:var(--sheet2);
    border-radius:999px;padding:8px 14px;font-size:15px;font-weight:800;color:var(--mint)}
  .shop-top .bank svg{width:17px;height:17px}

  .shop-cats{display:flex;gap:8px;padding:12px 18px;overflow-x:auto;flex:0 0 auto;
    scrollbar-width:none;border-bottom:1px solid var(--line)}
  .shop-cats::-webkit-scrollbar{display:none}
  .cat-pill{flex:0 0 auto;border:none;border-radius:999px;padding:8px 15px;font-family:inherit;
    font-size:12px;font-weight:800;letter-spacing:.02em;cursor:pointer;background:var(--sheet2);color:var(--dim)}
  .cat-pill.on{background:var(--pink);color:#fff;box-shadow:0 6px 16px rgba(245,50,91,.3)}

  .shop-body{flex:1;display:flex;min-height:0}
  .shop-list{flex:1;overflow-y:auto;padding:14px 14px calc(20px + env(safe-area-inset-bottom));
    display:grid;grid-template-columns:repeat(3,1fr);gap:11px;align-content:start;scrollbar-width:none}
  .shop-list::-webkit-scrollbar{display:none}
  .skin{position:relative;background:var(--sheet2);border:2.5px solid transparent;border-radius:18px;
    padding:12px 6px 10px;text-align:center;cursor:pointer;transition:transform .1s ease,border-color .15s}
  .skin:active{transform:scale(.94)}
  .skin.sel{border-color:var(--pink);box-shadow:0 8px 22px rgba(245,50,91,.22)}
  .skin .dot{width:52px;height:52px;border-radius:50%;margin:0 auto 7px;background-size:cover;
    background-color:#c9cfdd;box-shadow:0 6px 14px rgba(0,0,0,.2), inset 0 -3px 6px rgba(0,0,0,.12)}
  .skin.locked .dot{filter:grayscale(.6) brightness(.85)}
  .skin .lk{position:absolute;top:7px;right:7px;width:18px;height:18px;border-radius:50%;
    background:rgba(20,22,30,.55);display:grid;place-items:center}
  .skin .lk svg{width:10px;height:10px;color:#fff}
  .skin b{font-size:11.5px;font-weight:800;color:var(--ink);display:block;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .skin .cat{font-size:8px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);display:block;margin-top:1px}
  .skin .prc{font-size:11px;font-weight:800;margin-top:5px;display:flex;gap:3px;
    justify-content:center;align-items:center}
  .skin .prc svg{width:10px;height:10px}
  .skin .prc.ok{color:#00b87a}.skin .prc.no{color:var(--pink)}.skin .prc.eq{color:var(--pink)}

  .shop-preview{flex:0 0 168px;border-left:1px solid var(--line);display:flex;flex-direction:column;
    align-items:center;padding:18px 14px calc(20px + env(safe-area-inset-bottom));gap:10px}
  .pv-stage{width:132px;height:132px;border-radius:24px;background:
    radial-gradient(circle at 50% 32%, rgba(255,255,255,.9), rgba(255,255,255,0) 62%), var(--sheet2);
    display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;position:relative}
  .pv-stage canvas{width:100%!important;height:100%!important;display:block}
  .pv-name{font-size:15px;font-weight:800;color:var(--ink);text-align:center;line-height:1.15}
  .pv-cat{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .pv-desc{font-size:11.5px;color:var(--dim);font-weight:600;text-align:center;line-height:1.35;min-height:32px}
  .pv-price{display:flex;align-items:center;gap:5px;font-size:16px;font-weight:800;color:var(--pink)}
  .pv-price svg{width:15px;height:15px}
  .pv-price.owned{color:#00b87a}
  .pv-btn{width:100%;border:none;border-radius:14px;padding:13px;font-family:inherit;font-size:13.5px;
    font-weight:800;cursor:pointer;background:var(--pink);color:#fff;box-shadow:0 8px 20px rgba(245,50,91,.32)}
  .pv-btn:active{transform:scale(.96)}
  .pv-btn.ghost{background:var(--sheet2);color:var(--ink);box-shadow:none}
  .pv-btn[disabled]{opacity:.4;pointer-events:none}

  /* ---- PAUSE overlay ---- */
  #pauseOv{position:fixed;inset:0;z-index:24;display:none;align-items:center;justify-content:center;
    background:rgba(12,14,22,.5)}
  #pauseOv.show{display:flex}
  .pbox{text-align:center;color:var(--ink)}
  .pbox h2{font-size:34px;font-weight:800;color:var(--hud);margin-bottom:18px}
  .pbox .row{display:flex;gap:14px;justify-content:center}

  /* ---- GAME OVER ---- */
  #over{position:fixed;inset:0;z-index:21;display:none;flex-direction:column;align-items:center;
    justify-content:center;pointer-events:none}
  #over.show{display:flex}
  #overScore{font-size:64px;font-weight:800;color:var(--overlay);line-height:1;letter-spacing:-.03em}
  #overLbl{font-size:13px;font-weight:800;color:var(--overlay-dim);letter-spacing:.3em;margin-top:2px}
  #overBest{margin-top:14px;font-size:16px;font-weight:800;color:var(--overlay-dim)}
  #newbest{display:none;margin-top:12px;background:var(--mint);color:#052e22;font-weight:800;
    border-radius:999px;padding:6px 16px;font-size:13px;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
  #newbest.show{display:block}
  @keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
  #overStats{margin-top:20px;display:flex;gap:12px;justify-content:center}
  .ost{background:var(--sheet);border:1px solid var(--line);border-radius:16px;
    padding:10px 14px;min-width:84px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.08)}
  .ost svg{width:22px;height:22px;margin:0 auto;display:block;color:var(--pink)}
  .ost b{display:block;font-size:19px;font-weight:800;color:var(--overlay);margin-top:3px;line-height:1.1}
  .ost i{display:block;font-style:normal;font-size:9.5px;font-weight:700;color:var(--overlay-dim);
    text-transform:uppercase;letter-spacing:.04em;margin-top:1px}
  #overBtns{margin-top:26px;display:flex;align-items:center;justify-content:center;gap:14px;
    pointer-events:auto}

  /* ---- gift sheet ---- */
  #giftWrap{position:fixed;inset:0;z-index:23;display:none}
  #giftWrap.open{display:block}
  #giftScrim{position:absolute;inset:0;background:rgba(10,12,18,.35)}
  #giftBox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    background:var(--sheet);border-radius:22px;padding:26px 30px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.3)}
  #giftBox .gi{width:60px;height:60px;margin:0 auto 10px;color:var(--pink)}
  #giftBox .gi svg{width:100%;height:100%}
  #giftBox b{display:block;font-size:19px;font-weight:800;color:var(--ink);margin-bottom:4px}
  #giftBox span{font-size:13px;color:var(--dim);font-weight:600}
  #giftBox .btn{margin-top:16px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;
    border-radius:999px;padding:13px 30px;font-family:inherit;font-size:15px;font-weight:800;
    cursor:pointer;background:var(--pink);color:#fff;box-shadow:0 10px 24px rgba(245,50,91,.35)}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:var(--sheet2);color:var(--ink);box-shadow:none}
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<body data-theme="bright">
<div id="game"></div>
<div id="flash"></div>

<div id="hud" style="display:none">
  <div id="scoreBig">0</div>
  <div id="gemHud">
    <svg viewBox="0 0 24 24" fill="none"><path d="M6 3h12l4 6-10 12L2 9l4-6z" fill="#00c853"/><path d="M6 3l6 18 6-18M2 9h20" stroke="#fff" stroke-width="1.2"/></svg>
    <b id="gems">0</b>
  </div>
  <button id="pauseBtn" title="Pause">
    <svg viewBox="0 0 24 24" fill="none"><rect x="6" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg>
  </button>
</div>

<div class="toast" id="toast"></div>

<div id="home">
  <div id="homeTitle">CATCH<span class="up">UP</span></div>
  <div id="homeBest">BEST SCORE: <b id="bestScore">0</b></div>
  <div id="homeBtns">
    <button class="rbtn sm" id="modeBtn" title="Mode">
      <svg viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/></svg>
    </button>
    <button class="rbtn sm" id="shopBtn" title="Boutique">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 8h16v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8zM4 8l1.2-3.4A1 1 0 0 1 6.1 4h11.8a1 1 0 0 1 .9.6L20 8M9 12a3 3 0 0 0 6 0" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
    </button>
    <button class="rbtn play" id="playBtn" title="Jouer">
      <svg viewBox="0 0 24 24" fill="none"><path d="M8 5.5v13l11-6.5L8 5.5z" fill="currentColor"/></svg>
    </button>
    <button class="rbtn sm" id="giftBtn" title="Cadeau">
      <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="11" rx="1.5" stroke="currentColor" stroke-width="1.9"/><path d="M12 10v11M4 14h16M12 10S8 10 6.6 8.6 7.2 5.6 9 6.2 12 10 12 10zm0 0s4 0 5.4-1.4S16.8 5.6 15 6.2 12 10 12 10z" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
    </button>
    <button class="rbtn sm" id="bestBtn" title="Record">
      <svg viewBox="0 0 24 24" fill="none"><path d="M7 4h10v3a5 5 0 0 1-10 0V4zM7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3M10 14h4l1 6H9l1-6z" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>

<div id="shopWrap">
  <div id="shopScrim"></div>
  <div id="shopSheet">
    <div class="shop-top">
      <button class="back" id="shopBack"><svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h2>Boutique</h2>
      <span class="bank">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 3h12l4 6-10 12L2 9l4-6z" fill="currentColor"/></svg>
        <i id="shopBank" style="font-style:normal">0</i>
      </span>
    </div>
    <div class="shop-cats" id="shopCats"></div>
    <div class="shop-body">
      <div class="shop-list" id="skins"></div>
      <aside class="shop-preview">
        <div class="pv-stage"><canvas id="pvCanvas"></canvas></div>
        <div class="pv-name" id="pvName">—</div>
        <div class="pv-cat" id="pvCat"></div>
        <div class="pv-desc" id="pvDesc"></div>
        <div class="pv-price" id="pvPrice"></div>
        <button class="pv-btn" id="pvBtn">SÉLECTIONNER</button>
      </aside>
    </div>
  </div>
</div>

<div id="giftWrap">
  <div id="giftScrim"></div>
  <div id="giftBox">
    <div class="gi"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="11" rx="1.5" fill="currentColor"/><path d="M12 10v11M4 14h16" stroke="#fff" stroke-width="1.8"/></svg></div>
    <b>Cadeau gratuit</b>
    <span id="giftInfo">+50 diamants</span>
    <div><button class="btn" id="giftClaim">RÉCLAMER</button></div>
  </div>
</div>

<div id="pauseOv">
  <div class="pbox">
    <h2>PAUSE</h2>
    <div class="row">
      <button class="btn" id="resumeBtn">REPRENDRE</button>
      <button class="btn ghost" id="quitBtn">QUITTER</button>
    </div>
  </div>
</div>

<div id="over">
  <div id="overScore">0</div>
  <div id="overLbl">SCORE</div>
  <div id="overBest">BEST: <b id="finalBest">0</b></div>
  <div id="overStats">
    <div class="ost">
      <svg viewBox="0 0 24 24" fill="none"><path d="M6 3h12l4 6-10 12L2 9l4-6z" fill="currentColor"/></svg>
      <b id="overCoins">0</b><i>diamants</i>
    </div>
    <div class="ost">
      <svg viewBox="0 0 24 24" fill="none"><path d="M13 2L4.09 12.69C3.74 13.11 3.56 13.32 3.56 13.53c0 .18.07.35.22.45.16.11.42.11.93.11H12l-1 8 8.91-10.69C20.26 11.11 20.44 10.9 20.44 10.69c0-.18-.07-.35-.22-.45-.16-.11-.42-.11-.93-.11H12l1-8z" fill="currentColor"/></svg>
      <b id="overCombo">x0</b><i>combo max</i>
    </div>
    <div class="ost">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 4l1.5 4.5L18 12l-4.5 1.5L12 18l-1.5-4.5L6 12l4.5-1.5L12 6z" fill="currentColor"/></svg>
      <b id="overSpeed">0</b><i>vitesse</i>
    </div>
  </div>
  <div id="newbest">NOUVEAU RECORD !</div>
  <div id="overBtns">
    <button class="rbtn sm" id="homeBtn" title="Menu">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 11l8-7 8 7M6 10v9h5v-5h2v5h5v-9" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
    </button>
    <button class="rbtn play" id="retryBtn" title="Rejouer">
      <svg viewBox="0 0 24 24" fill="none"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>
<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);

const store = {
  get(k,d){ try{ const v=localStorage.getItem('catchup_'+k); return v===null?d:JSON.parse(v);}catch{return d} },
  set(k,v){ try{ localStorage.setItem('catchup_'+k, JSON.stringify(v)); }catch{} }
};
let bank = store.get('diamonds',500);
let best = store.get('best',0);
let dark = store.get('night',false);
let skinId = store.get('skin','classic');
let unlocked = store.get('unlocked',['classic']);
let giftTotal = store.get('gifts',0);
let giftStreak = store.get('giftStreak',0);

const SKINS_IDS=['classic','mint','skyb','sun','coral','lilac','smiley','heart','starb','stripe','dots','checker','marble','neon','sunset','fr','de','it','es','jp','br','us','gb','gold','rainbow','galaxy','lavast','diamx','ghost','void'];
unlocked = [...new Set(unlocked.filter(id=>SKINS_IDS.includes(id)))];
if(!unlocked.includes('classic')) unlocked.push('classic');
if(!unlocked.includes(skinId)) skinId='classic';

const CATS = {
  regular:{label:'Regular', col:'#8b94a7'},
  social:{label:'Social', col:'#00d68f'},
  rare:{label:'Rare', col:'#35c2ff'},
  flag:{label:'Flag', col:'#a06bff'},
  premium:{label:'Premium', col:'#ffb020'},
  secret:{label:'Secret', col:'#f5325b'}
};

const SKINS = [
  {id:'classic', name:'Classic', cat:'regular', style:'solid', c:['#2b2f38','#14161c']},
  {id:'mint', name:'Menthe', cat:'regular', style:'solid', c:['#00e5a0','#00b47e']},
  {id:'skyb', name:'Ciel', cat:'regular', style:'solid', c:['#00b4ff','#0072c0']},
  {id:'sun', name:'Soleil', cat:'regular', style:'solid', c:['#ffc93c','#e59b00']},

const tCache = {};
function genTex(s){
  if(tCache[s.id]) return tCache[s.id];
  const W=256,H=128,c=document.createElement('canvas');c.width=W;c.height=H;
  const g=c.getContext('2d');const [a,b,d]=s.c;const st=s.style;
  g.fillStyle=a;g.fillRect(0,0,W,H);
  if(st==='stripes'){g.fillStyle=b;for(let x=0;x<W;x+=W/8)g.fillRect(x,0,W/16,H);}
  else if(st==='dots'){g.fillStyle=b;for(let y=0;y<H;y+=H/4)for(let x=0;x<W;x+=W/6){g.beginPath();g.arc(x+((y/(H/4))%2?W/12:0),y+H/8,H/10,0,7);g.fill();}}
  else if(st==='checker'){g.fillStyle=b;for(let y=0;y<8;y++)for(let x=0;x<8;x++)if((x+y)%2)g.fillRect(x*W/8,y*H/8,W/8,H/8);}
  else if(st==='gradient'){const gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,a);gr.addColorStop(1,b);g.fillStyle=gr;g.fillRect(0,0,W,H);}
  else if(st==='marble'){g.strokeStyle=b;for(let i=0;i<22;i++){g.lineWidth=1+Math.random()*3.5;g.globalAlpha=.25+Math.random()*.5;g.beginPath();let x=Math.random()*W,y=Math.random()*H;g.moveTo(x,y);for(let k=0;k<5;k++){x+=(Math.random()-.5)*90;y+=(Math.random()-.5)*50;g.lineTo(x,y);}g.stroke();}g.globalAlpha=1;}
  else if(st==='neon'){g.strokeStyle=b;g.lineWidth=5;g.shadowColor=b;g.shadowBlur=14;for(let i=0;i<7;i++){g.beginPath();g.moveTo(Math.random()*W,Math.random()*H);g.lineTo(Math.random()*W,Math.random()*H);g.stroke();}g.shadowBlur=0;}
  else if(st==='metal'){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,a);gr.addColorStop(.45,b);gr.addColorStop(.55,a);gr.addColorStop(1,b);g.fillStyle=gr;g.fillRect(0,0,W,H);}
  else if(st==='rainbow'){const gr=g.createLinearGradient(0,0,W,0);s.c.forEach((col,i)=>gr.addColorStop(i/(s.c.length-1),col));g.fillStyle=gr;g.fillRect(0,0,W,H);}
  else if(st==='galaxy'){const gr=g.createRadialGradient(W/2,H/2,10,W/2,H/2,W/2);gr.addColorStop(0,b);gr.addColorStop(1,a);g.fillStyle=gr;g.fillRect(0,0,W,H);g.fillStyle=d;for(let i=0;i<90;i++)g.fillRect(Math.random()*W,Math.random()*H,1.6,1.6);}
  else if(st==='lava'){g.strokeStyle=b;g.lineWidth=7;g.shadowColor=b;g.shadowBlur=16;for(let i=0;i<9;i++){g.beginPath();let x=Math.random()*W,y=Math.random()*H;g.moveTo(x,y);for(let k=0;k<4;k++){x+=(Math.random()-.5)*80;y+=(Math.random()-.5)*50;g.lineTo(x,y);}g.stroke();}g.shadowBlur=0;}
  else if(st==='facets'){g.fillStyle=b;for(let i=0;i<40;i++){const x=Math.random()*W,y=Math.random()*H,r=14+Math.random()*26;g.globalAlpha=.3+Math.random()*.5;g.beginPath();g.moveTo(x,y-r);g.lineTo(x+r,y);g.lineTo(x,y+r);g.lineTo(x-r,y);g.closePath();g.fill();}g.globalAlpha=1;}
  else if(st==='flag3v'){[a,b,d].forEach((col,i)=>{g.fillStyle=col;g.fillRect(i*W/3,0,W/3,H);});}
  else if(st==='flag3h'){[a,b,d].forEach((col,i)=>{g.fillStyle=col;g.fillRect(0,i*H/3,W,H/3);});}
  else if(st==='flagjp'){g.fillStyle=b;g.beginPath();g.arc(W/2,H/2,H/3,0,7);g.fill();}
  else if(st==='flagbr'){g.fillStyle=b;g.beginPath();g.moveTo(W/2,6);g.lineTo(W-8,H/2);g.lineTo(W/2,H-6);g.lineTo(8,H/2);g.closePath();g.fill();g.fillStyle='#2d4dff';g.beginPath();g.arc(W/2,H/2,H/6,0,7);g.fill();}
  else if(st==='flagus'){for(let i=0;i<7;i++){g.fillStyle=i%2?a:'#fff';g.fillRect(0,i*H/7,W,H/7);}g.fillStyle=b;g.fillRect(0,0,W*.42,H*4/7);}
  else if(st==='flaggB'){g.fillStyle=a;g.fillRect(0,0,W,H);g.fillStyle='#fff';g.fillRect(0,H/2-14,W,28);g.fillRect(W/2-20,0,40,H);g.fillStyle=d;g.fillRect(0,H/2-9,W,18);g.fillRect(W/2-12,0,24,H);}
  else if(st==='smiley'){g.fillStyle='#23263b';g.beginPath();g.arc(W*.36,H/2,11,0,7);g.fill();g.beginPath();g.arc(W*.64,H/2,11,0,7);g.fill();g.strokeStyle='#23263b';g.lineWidth=9;g.lineCap='round';g.beginPath();g.arc(W/2,H*.42,H*.28,.4,Math.PI-.4);g.stroke();}
  else if(st==='heart'){g.fillStyle=b;const heart=(x,y,s)=>{g.beginPath();g.moveTo(x,y+s*.9);g.bezierCurveTo(x-s*1.4,y,x-s*.7,y-s*.9,x,y-s*.25);g.bezierCurveTo(x+s*.7,y-s*.9,x+s*1.4,y,x,y+s*.9);g.fill();};heart(W*.25,H*.5,22);heart(W*.75,H*.5,22);}
  else if(st==='star'){g.fillStyle=b;const star=(x,y,r)=>{g.beginPath();for(let i=0;i<10;i++){const rr=i%2?r*.45:r,ang=-Math.PI/2+i*Math.PI/5;g.lineTo(x+Math.cos(ang)*rr,y+Math.sin(ang)*rr);}g.closePath();g.fill();};star(W*.25,H*.5,26);star(W*.75,H*.5,26);}
  else if(st==='ghost'){g.fillStyle=b;g.beginPath();g.arc(W*.25,H*.48,20,0,7);g.fill();g.beginPath();g.arc(W*.75,H*.48,20,0,7);g.fill();}
  else if(st==='void'){const gr=g.createRadialGradient(W/2,H/2,4,W/2,H/2,W/2);gr.addColorStop(0,a);gr.addColorStop(.72,'#08060f');gr.addColorStop(1,b);g.fillStyle=gr;g.fillRect(0,0,W,H);g.strokeStyle=b;g.lineWidth=6;g.shadowColor=b;g.shadowBlur=20;g.beginPath();g.ellipse(W/2,H/2,W/2.4,H/2.6,0,0,7);g.stroke();g.shadowBlur=0;}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;tCache[s.id]=t;return t;
}
function previewUrl(s){ if(s._url)return s._url; genTex(s); s._url=tCache[s.id].image.toDataURL('image/png'); return s._url; }

function shopAction(){

let AC=null;
function beep(f=600,d=.08,type='sine',g=.12){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const o=AC.createOscillator(), gn=AC.createGain();
    o.type=type; o.frequency.value=f; gn.gain.value=g;
    o.connect(gn); gn.connect(AC.destination);
    o.start(); gn.gain.exponentialRampToValueAtTime(.001, AC.currentTime+d);
    o.stop(AC.currentTime+d);
  }catch(e){}
}

function makeSeg(z){
  const g=new THREE.Group();
  const road=new THREE.Mesh(geo('road',()=>new THREE.BoxGeometry(ROAD_W,.3,SEG_LEN)),M.road);
  road.position.set(0,-.15,0);g.add(road);

}

const ballMat=new THREE.MeshStandardMaterial({color:0x2b2f38,roughness:.45,metalness:.05});

scene.add(ball);
function applyBallSkin(){
  const s=skinDef();
  ballMat.map=genTex(s);
  ballMat.color.set(0xffffff);
  ballMat.metalness=s.metal?.7:0;
  ballMat.roughness=s.metal?.3:.45;
  if(s.glow){ballMat.emissive.set(s.c[s.c.length-1]);ballMat.emissiveIntensity=.4;}
  else ballMat.emissive.set(0x000000);
  ballMat.needsUpdate=true;
  trailColor=new THREE.Color(s.id==='classic'?0x3a3f4a:s.c[0]);
  trailMat.color.copy(trailColor);
}
let trailColor=new THREE.Color(0x3a3f4a);
const shadowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(10,12,20,.55)');gr.addColorStop(1,'rgba(10,12,20,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);const t=new THREE.CanvasTexture(c);return t})();
const shadow=new THREE.Mesh(geo('shadow',()=>new THREE.PlaneGeometry(1.3,1.3)),new THREE.MeshBasicMaterial({map:shadowTex,transparent:true,depthWrite:false,opacity:.5}));
shadow.rotation.x=-Math.PI/2;scene.add(shadow);

const TRAIL_N=90;
const trailPts=[];
const trailGeo=geo('trailg',()=>new THREE.BufferGeometry());
const trailMat=new THREE.MeshBasicMaterial({color:trailColor.clone(),transparent:true,opacity:.5,depthWrite:false,side:THREE.DoubleSide,blending:THREE.NormalBlending});
const trailMesh=new THREE.Mesh(trailGeo,trailMat);
trailMesh.frustumCulled=false; scene.add(trailMesh);
function pushTrail(x,y,z){
  trailPts.unshift({x,y,z,t:performance.now()});
  if(trailPts.length>TRAIL_N) trailPts.length=TRAIL_N;
  buildTrail();
}
function buildTrail(){
  const n=trailPts.length;
  if(n<3){ trailMesh.geometry.setDrawRange(0,0); return; }
  const pos=[],idx=[];
  for(let i=0;i<n;i++){
    const p=trailPts[i];
    const w=.34*(1-i/n)*(1-i/n);
    pos.push(p.x-w,p.y,p.z, p.x+w,p.y,p.z);
  }
  for(let i=0;i<n-1;i++){ const a=i*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); }
  const g=trailMesh.geometry;
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx);
  g.computeVertexNormals();
  g.setDrawRange(0,idx.length);
}
function decayTrail(dt){
  const now=performance.now();
  let changed=false;
  for(let i=trailPts.length-1;i>=0;i--){ if(now-trailPts[i].t>900){ trailPts.splice(i,1); changed=true; } }
  if(changed) buildTrail();
}
function resetTrail(){ trailPts.length=0; trailMesh.geometry.setDrawRange(0,0); }

const BURST_N=220;
const burstPts=[];
const burstGeo=geo('burstg',()=>new THREE.BufferGeometry());
const burstMat=new THREE.PointsMaterial({color:0xf5325b,size:.45,transparent:true,opacity:1,depthWrite:false,blending:THREE.AdditiveBlending});
const burstMesh=new THREE.Points(burstGeo,burstMat);
burstMesh.frustumCulled=false; scene.add(burstMesh);
function burstAt(x,y,z,color=0xf5325b){
  burstMat.color.set(color);
  for(let i=0;i<70;i++){
    const a=Math.random()*Math.PI*2, e=Math.random()*Math.PI-Math.PI/2;
    const sp=3+Math.random()*7;
    burstPts.push({x,y,z, vx:Math.cos(a)*Math.cos(e)*sp, vy:Math.sin(e)*sp+4, vz:Math.sin(a)*Math.cos(e)*sp*0.4, life:1});
  }
}
function updateBurst(dt){
  if(!burstPts.length){ burstMesh.geometry.setDrawRange(0,0); return; }
  const pos=[];
  for(let i=burstPts.length-1;i>=0;i--){
    const p=burstPts[i];
    p.vy-=18*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
    p.life-=dt*0.55;
    if(p.life<=0){ burstPts.splice(i,1); continue; }
    pos.push(p.x,p.y,p.z);
  }
  const g=burstMesh.geometry;
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setDrawRange(0,pos.length/3);
  burstMat.opacity=Math.max(0,Math.min(1,burstPts[0]?.life||0));
}

/* --- world objects --- */
const cubes=[],walls=[],gems=[],pads=[],catchers=[],coins=[];
const cubeGeo=geo('cube',()=>new THREE.BoxGeometry(1,1,1));
const gemGeo=geo('gem',()=>new THREE.OctahedronGeometry(.35));
const coinGeo=geo('coin',()=>new THREE.CylinderGeometry(.32,.32,.09,20));

function addCube(x,z,size=1,mover=false){
  const m=new THREE.Mesh(cubeGeo,M.cubeMats[(Math.random()*3)|0]);
  const s=size*(.85+Math.random()*.5);

  m.position.set(x,m.scale.y/2,z);
  scene.add(m); cubes.push({m,x,z,r:s*.5,mover,ph:Math.random()*6,amp:mover?1.4+Math.random()*1.8:0});
}
function addWall(z, withPad=true){
  if(withPad) addPad(0, z+5.5, true);
  const m=new THREE.Mesh(wallGeo,M.wall.clone());
  m.material.color.set(dark?0x4a8a7a:0x8fe0c0);

}
function addGem(x,y,z){
  const m=new THREE.Mesh(gemGeo,M.gem);
  m.position.set(x,y,z);
  m.rotation.z=Math.PI/4;
  scene.add(m); gems.push({m,x,y,z,taken:false});
}
function addCoin(x,y,z){
  const m=new THREE.Mesh(coinGeo,M.gem);
  m.position.set(x,y,z);
  m.rotation.x=Math.PI/2;
  scene.add(m); coins.push({m,x,y,z,taken:false,ph:Math.random()*6});
}
function addPad(x,z,wide=false){
  const m=new THREE.Mesh(padGeo,M.pad);
  m.position.set(x,GROUND_Y+.03,z);
  const r=new THREE.Mesh(padRingGeo,M.padW);
  r.rotation.x=-Math.PI/2; r.position.set(x,GROUND_Y+.05,z);
  scene.add(m); scene.add(r);
  pads.push({m,r,x,z,wide});
}
function addCatchBall(x,z){
  const mat=new THREE.MeshStandardMaterial({color:ballMat.color.clone(),roughness:.4,metalness:.05,map:ballMat.map});
  const m=new THREE.Mesh(catcherGeo,mat);
  m.position.set(x,.5,z);
  scene.add(m);
  catchers.push({m,x,z,hit:false});

function spawnRow(z,kind,diff){
  const xr=()=>-(ROAD_W/2-.9)+Math.random()*(ROAD_W-1.8);
  const lane=i=>-ROAD_W/2+1.15+i*1.6;
  if(kind==='cubes'){
    const n=1+((Math.random()*(1.4+diff*3))|0);
    for(let i=0;i<n;i++) addCube(xr(), z-Math.random()*5, .95+Math.random()*.7);
  } else if(kind==='wall'){
    addWall(z, true);
    addCube((Math.random()<.5?-1:1)*(ROAD_W/2-.85), z-3-Math.random()*2, .85);
  } else if(kind==='spread'){
    addCube(-(ROAD_W/2-1), z, 1.05);
    addCube(ROAD_W/2-1, z-2.5, 1.05);
    if(Math.random()<.6) addCube(xr(), z-5, .95);
  } else if(kind==='pad'){
    addPad(xr(), z);
    addCube(xr(), z-5.5, .95);
    if(diff>.35&&Math.random()<.6) addCube(xr(), z-8.5, .85);
  } else if(kind==='coins'){
    const gx=xr(), n=3+((Math.random()*3)|0);
    for(let i=0;i<n;i++) addCoin(gx+(Math.random()-.5)*1.4, .55+Math.sin(i*.9)*.18, z-i*1.5);
  } else if(kind==='catch'){
    addCatchBall(xr(), z);
    addCube(xr(), z-4, .85);
  } else if(kind==='mover'){
    addCube(xr(), z, 1.15, true);
  } else if(kind==='gates'){
    const g=ROAD_W/3, hole=((Math.random()*3)|0);
    for(let i=0;i<3;i++){ if(i===hole) continue; addCube(-g+i*g, z, 1.35); }
    const gx=-g+hole*g;
    addCoin(gx,.7,z-1.5); addCoin(gx,.75,z-3);
  } else if(kind==='stair'){
    const n=3+((Math.random()*3)|0);
    for(let i=0;i<n;i++) addCube(lane(((i%2)?0:2)), z-i*2.6, 1+ i*.14);
  } else if(kind==='tunnel'){
    const t=3+((Math.random()*3)|0);
    for(let i=0;i<t;i++){ addCube(-(ROAD_W/2-1), z-i*2.4, .95); addCube(ROAD_W/2-1, z-i*2.4, .95); }
    addGem(0,.6,z-2.4*(t-1)/2);
  } else if(kind==='zigzag'){
    for(let i=0;i<4;i++) addCube(lane(i%2?0:2), z-i*2.4, 1.05);
  }
}

function pickKind(sinceHard){
  const d=state.diff, r=Math.random();
  if(sinceHard>=13 && r<.28) return 'wall';
  if(d<.08){
    if(r<.5) return 'cubes';
    if(r<.72) return 'coins';
    if(r<.86) return 'gates';
    return 'catch';
  }
  if(d<.3){
    if(r<.34) return 'cubes';
    if(r<.5) return 'gates';
    if(r<.62) return 'coins';
    if(r<.72) return 'mover';
    if(r<.82) return 'spread';
    if(r<.9) return 'pad';
    return 'catch';
  }
  if(r<.24) return 'cubes';
  if(r<.38) return 'gates';
  if(r<.5) return 'mover';
  if(r<.6) return 'zigzag';
  if(r<.7) return 'tunnel';
  if(r<.8) return 'stair';
  if(r<.86) return 'pad';
  if(r<.92) return 'coins';
  return sinceHard>=13?'wall':'catch';
}

function spawnNext(safe=false){
  const gap=9-state.diff*3.8;
  const z=Math.min(spawnZ===0?-36:spawnZ-gap, ballZ-36);
  if(safe){ addCoin(0,.7,z); addCoin(0,.7,z-1.6); spawnZ=z; return; }
  const sinceHard=ballZ-state.lastHardZ;
  const kind=pickKind(sinceHard);
  spawnRow(z,kind,state.diff);
  if(kind==='wall') state.lastHardZ=ballZ;
  spawnZ=z;
}

  burstMesh.geometry.setDrawRange(0,0);
  resetTrail();
  reseatSegments();
}

/* --- physics / scoring step --- */
const HALF=ROAD_W/2-.55;
function step(h){
  const sp=state.speed;
  ballZ-=sp*h;
  state.dist+=sp*h;
  state.t+=h;
  state.speed=Math.min(SPEED_MAX, 15+state.dist/45*SPEED_RAMP);
  state.diff=Math.min(1,state.dist/1100);

  const tx=targetLane*HALF;
  const stiff=Math.min(1, 10*h);
  ballVX += (tx-ballX)*stiff*2.6;
  ballVX *= Math.pow(.0025,h);
  ballX += ballVX*h*6;
  ballX=Math.max(-HALF,Math.min(HALF,ballX));
  spin += (ballVX*3 - sp)*h*1.4;

  let by=.5+Math.abs(Math.sin(state.t*7))*.03;
  if(state.padBoostT>0){
    state.padBoostT-=h;
    by=.5+Math.max(0,Math.sin((1-Math.max(0,state.padBoostT)/.5)*Math.PI))*1.9;
    if(state.padBoostT<=0) state.padBoostT=0;
  }
  ball.position.set(ballX,by,ballZ);
  ball.rotation.z=spin; ball.rotation.x=ballZ*.5;
  shadow.position.set(ballX,GROUND_Y+.02,ballZ);

  pushTrail(ballX, by, ballZ);
  updateBurst(h);

  const sc=Math.floor(state.dist/6);
  if(sc!==state.score){
    state.score=sc;
    $('scoreBig').textContent=fmt(sc);
  }

  ground.position.z=ballZ;
  for(const s of segs){
    if(s.z>ballZ+40){
      const minZ=Math.min(...segs.map(x=>x.z));
      s.g.position.z=minZ-SEG_LEN;
      s.z=minZ-SEG_LEN;
    }
  }
  recycleBuildings();

  for(let i=cubes.length-1;i>=0;i--){
    const c=cubes[i];
    if(c.mover){ c.m.position.x=Math.max(-HALF,Math.min(HALF,c.x+Math.sin(state.t*2.4+c.ph)*c.amp)); }
    if(Math.abs(c.m.position.x-ballX)<(c.r+.5) && Math.abs(c.m.position.z-ballZ)<(c.r+.55) && by<1.15){
      die(); return;
    }
    if(c.m.position.z>ballZ+14){ scene.remove(c.m); cubes.splice(i,1); }
  }
  for(let i=walls.length-1;i>=0;i--){
    const w=walls[i];
    if(Math.abs(w.m.position.z-ballZ)<.7 && by<1.1){ die(); return; }
    if(w.m.position.z>ballZ+14){ scene.remove(w.m); walls.splice(i,1); }
  }
  for(let i=gems.length-1;i>=0;i--){
    const g=gems[i];
    g.m.rotation.y+=3*h;
    if(!g.taken && Math.abs(g.m.position.x-ballX)<.75 && Math.abs(g.m.position.z-ballZ)<.75 && Math.abs(g.m.position.y-by)<.95){
      g.taken=true; bank++; store.set('diamonds',bank);
      refreshBank(); beep(900,.05,'sine',.08);
      scene.remove(g.m); gems.splice(i,1); continue;
    }
    if(g.m.position.z>ballZ+14){ scene.remove(g.m); gems.splice(i,1); }
  }
  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i];
    if(c.taken){
      c.m.position.y+=c.vy*h; c.vy-=9.8*h;
      c.m.scale.multiplyScalar(1-2.5*h);
      if(c.m.position.y<GROUND_Y||c.m.scale.x<.05){ scene.remove(c.m); coins.splice(i,1); }
      continue;
    }
    c.m.rotation.z+=4*h; c.m.position.y=c.y+Math.sin(state.t*4+c.ph)*.06;
    if(!c.taken && Math.abs(c.m.position.x-ballX)<.8 && Math.abs(c.m.position.z-ballZ)<.8 && Math.abs(c.m.position.y-by)<.95){
      c.taken=true; c.vy=2+Math.random()*2.5; state.combo++; state.bestCombo=Math.max(state.bestCombo,state.combo);
      state.coins++;
      const gain=1+Math.floor(state.combo/4);
      bank+=gain; store.set('diamonds',bank);
      refreshBank();
      if(state.combo%4===0){ beep(760,.1,'sine',.12); toast(`Combo x${state.combo} !`); }
      else beep(880+state.combo*20,.04,'sine',.07);
      scene.remove(c.m); coins.splice(i,1); continue;
    }
    if(c.m.position.z>ballZ+14){ scene.remove(c.m); coins.splice(i,1); }
  }
  for(let i=pads.length-1;i>=0;i--){
    const p=pads[i];
    if(Math.abs(p.x-ballX)<(p.wide?1.7:1.15) && Math.abs(p.z-ballZ)<.9 && by<.8){
      state.padBoostT=.5;
      beep(520,.08,'sine',.1);
      scene.remove(p.m); scene.remove(p.r); pads.splice(i,1);
      continue;
    }
    if(p.z>ballZ+14){ scene.remove(p.m); scene.remove(p.r); pads.splice(i,1); }
  }
  for(let i=catchers.length-1;i>=0;i--){
    const c=catchers[i];
    c.m.rotation.y+=2*h; c.m.position.y=.5+Math.sin(state.t*4+c.x)*.15;
    if(!c.hit && Math.abs(c.m.position.x-ballX)<.85 && Math.abs(c.m.position.z-ballZ)<.85){
      c.hit=true;
      bank+=5; store.set('diamonds',bank);
      for(let k=0;k<8;k++) addCoin(c.m.position.x+(Math.random()-.5)*2, .55+Math.random()*1.3, c.m.position.z+(Math.random()-.5)*2);
      refreshBank(); beep(1100,.12,'sine',.14);
      toast('+5 diamants !');
      scene.remove(c.m); catchers.splice(i,1); continue;
    }
    if(c.m.position.z>ballZ+14){ scene.remove(c.m); catchers.splice(i,1); }
  }

  while(spawnZ>ballZ-78) spawnNext(Math.random()<.06);
}

/* --- render loop --- */
let last=performance.now();
let shake=0;
function frame(){
  requestAnimationFrame(frame);
  const now=performance.now();
  let dt=(now-last)/1000; last=now;
  dt=Math.min(dt,.05);

  if(state.running && !state.paused){
    step(dt);
  } else if(!state.running && !state.over){
    previewT+=dt;
    ball.position.set(0,.5+Math.sin(previewT*2)*.08,0);
    ball.rotation.y+=dt*.8; ball.rotation.z+=dt*.3;
    shadow.position.set(0,GROUND_Y+.02,0);
    for(const s of segs){
      s.g.position.z+=dt*2; s.z=s.g.position.z;
      if(s.z>40){ const minZ=Math.min(...segs.map(x=>x.z)); s.g.position.z=s.z=minZ-SEG_LEN; }
    }
    for(const b of buildings){
      b.mesh.position.z+=dt*2;
      if(b.mesh.position.z>30) spawnBuilding(b, -150-Math.random()*20);
    }
    ground.position.z=0;
    decayTrail(dt);
    updateBurst(dt);
  } else {
    decayTrail(dt);
    updateBurst(dt);
  }

  const spN=state.over?0:Math.max(0,(state.speed-15)/(SPEED_MAX-15));
  const camY=3.1+spN*.35, camZ=ballZ+6.2+spN*.9;
  camera.position.set(ballX*.35, camY+shake, camZ);
  camera.lookAt(ballX*.5, .6, ballZ-8);
  shake*=Math.pow(.0006,dt);
  if(shake<.01) shake=0;
  camera.fov=55+spN*6;
  camera.updateProjectionMatrix();
  renderer.render(scene,camera);
}

applyMode();
applyBallSkin();
updateMenu();
$('hud').style.display='none';
frame();
</script>
